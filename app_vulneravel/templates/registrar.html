<!doctype html>
<html lang="pt-br">
<head><meta charset="utf-8"><title>Registrar (vulneravel)</title></head>
<body>
  <h1>Registrar — versao VULNERAVEL</h1>
  {% if erro %}<p style="color:red">{{ erro }}</p>{% endif %}
  <form method="post">
    <label>Usuario: <input name="usuario"></label><br>
    <label>Senha: <input name="senha" type="password"></label><br>
    <button type="submit">Criar conta</button>
  </form>
  <p><a href="{{ url_for('login') }}">Voltar ao login</a></p>
</body>
</html>
